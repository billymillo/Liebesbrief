<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glücksrad & Team-Picker</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg1: #fde8ec;
      --bg2: #f5bfcc;
      --title: #7a1f36;
      --ink: #4a2c35;
      --rose: #c2415d;
      --paper: #fffaf0;
      --card: rgba(255, 250, 240, .78);
      --sh: rgba(120, 40, 60, .3);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg1: #2a1320;
        --bg2: #47182e;
        --title: #ffd6e0;
        --ink: #ffe6ec;
        --card: rgba(255, 255, 255, .08);
        --sh: rgba(0, 0, 0, .5)
      }
    }

    :root[data-theme="dark"] {
      --bg1: #2a1320;
      --bg2: #47182e;
      --title: #ffd6e0;
      --ink: #ffe6ec;
      --card: rgba(255, 255, 255, .08);
      --sh: rgba(0, 0, 0, .5)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
      background-color: var(--bg1);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      overflow-x: hidden
    }

    .script {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-weight: 400
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      position: relative;
      z-index: 1
    }

    header {
      text-align: center;
      position: relative
    }

    h1 {
      font-size: clamp(42px, 10vw, 70px);
      color: var(--title);
      margin: 6px 0 0;
      line-height: 1.1
    }

    .sub {
      color: var(--title);
      font-style: italic;
      margin: 0 0 14px
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px
    }

    .b {
      font: inherit;
      font-weight: 700;
      font-size: 18px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 2px solid var(--rose);
      background: var(--rose);
      color: #fff;
      cursor: pointer;
      transition: transform .2s;
      box-shadow: 0 6px 16px var(--sh);
      text-decoration: none;
      display: inline-block
    }

    .b:hover {
      transform: translateY(-3px) scale(1.04)
    }

    .b:active {
      transform: scale(.94)
    }

    .b.alt {
      background: transparent;
      color: var(--rose);
      box-shadow: none
    }

    .b.sm {
      padding: 6px 14px;
      font-size: 16px
    }

    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 12px 0 22px
    }

    .tabs .b {
      background: transparent;
      color: var(--rose);
      box-shadow: none
    }

    .tabs .b.on {
      background: var(--rose);
      color: #fff;
      box-shadow: 0 6px 16px var(--sh)
    }

    .grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 22px;
      align-items: start
    }

    @media(max-width:820px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 34px var(--sh)
    }

    .card h3 {
      margin: 0 0 8px;
      color: var(--title);
      font-size: 26px
    }

    textarea,
    select,
    input[type=number] {
      width: 100%;
      font: inherit;
      font-size: 19px;
      color: var(--ink);
      background: var(--card);
      border: 2px solid rgba(194, 65, 93, .35);
      border-radius: 12px;
      padding: 10px;
      outline: 0
    }

    textarea {
      height: 210px;
      resize: vertical;
      line-height: 1.5
    }

    textarea:focus,
    select:focus,
    input:focus {
      border-color: var(--rose)
    }

    .row {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      align-items: center;
      flex-wrap: wrap
    }

    .row>* {
      flex: 1
    }

    label.ck {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer
    }

    label.ck input {
      width: 20px;
      height: 20px;
      accent-color: #c2415d
    }

    .cnt {
      color: var(--rose);
      font-weight: 700
    }

    /* wheel */
    .stage {
      text-align: center
    }

    .wrap {
      position: relative;
      width: min(100%, 520px);
      margin: 0 auto;
      aspect-ratio: 1
    }

    .wrap.pressed {
      animation: squish .4s
    }

    @keyframes squish {
      30% {
        transform: scale(.93, 1.05)
      }

      60% {
        transform: scale(1.04, .97)
      }
    }

    canvas {
      display: block;
      border-radius: 50%;
      filter: drop-shadow(0 14px 22px var(--sh))
    }

    .ptr {
      position: absolute;
      left: 50%;
      top: -14px;
      transform: translateX(-50%);
      font-size: 52px;
      color: #a82a46;
      z-index: 3;
      line-height: 1;
      transform-origin: 50% 20%;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .3))
    }

    .ptr::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      margin-left: -9px;
      border: 9px solid transparent;
      border-top: 16px solid #a82a46;
      border-bottom: 0
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22%;
      aspect-ratio: 1;
      margin: -11% 0 0 -11%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff7ee, #f6c1a8);
      border: 6px solid #c2415d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 48px);
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
      transition: transform .2s
    }

    .hub:hover {
      transform: scale(1.08)
    }

    .hub.dz {
      animation: dz .35s infinite
    }

    @keyframes dz {
      25% {
        transform: rotate(-14deg) scale(1.1)
      }

      75% {
        transform: rotate(14deg) scale(1.1)
      }
    }

    .hint {
      font-style: italic;
      color: var(--title);
      margin: 14px 0 4px
    }

    .hist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px
    }

    .chip {
      background: var(--rose);
      color: #fff;
      border-radius: 999px;
      padding: 3px 14px;
      font-size: 17px;
      animation: pop .5s both
    }

    @keyframes pop {
      from {
        transform: scale(0) rotate(-20deg)
      }

      70% {
        transform: scale(1.2)
      }

      to {
        transform: scale(1)
      }
    }

    /* teams */
    #hat {
      font-size: 90px;
      display: none;
      animation: shake .35s infinite
    }

    @keyframes shake {
      25% {
        transform: rotate(-18deg) translateY(-8px)
      }

      75% {
        transform: rotate(18deg) translateY(-8px)
      }
    }

    .tgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      text-align: left
    }

    .team {
      background: var(--paper);
      color: #4a2c35;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 24px var(--sh);
      animation: drop .8s cubic-bezier(.2, 1.4, .4, 1) both
    }

    @keyframes drop {
      from {
        opacity: 0;
        transform: translateY(-120px) scale(.2) rotate(var(--r))
      }

      to {
        opacity: 1;
        transform: rotate(var(--t))
      }
    }

    .team h4 {
      margin: 0;
      padding: 8px 12px;
      font-size: 22px;
      color: #fff;
      display: flex;
      justify-content: space-between
    }

    .team ul {
      list-style: none;
      margin: 0;
      padding: 10px 14px 14px
    }

    .team li {
      padding: 3px 0;
      font-size: 21px;
      font-weight: 700;
      animation: pop .5s both
    }

    .team li::before {
      content: "♥ ";
      color: #c2415d
    }

    /* fx */
    .fl,
    .bu {
      position: fixed;
      pointer-events: none;
      color: #c2415d
    }

    .fl {
      bottom: -30px;
      opacity: .5;
      animation: up linear forwards;
      z-index: 0
    }

    @keyframes up {
      to {
        transform: translateY(-115vh) rotate(40deg);
        opacity: 0
      }
    }

    .bu {
      z-index: 150;
      animation: burst 1.4s ease-out forwards
    }

    @keyframes burst {
      to {
        transform: translate(var(--x), var(--y)) scale(.4) rotate(var(--r));
        opacity: 0
      }
    }

    #win {
      position: fixed;
      inset: 0;
      background: rgba(40, 8, 22, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px
    }

    .wc {
      background: #fffaf0;
      color: #4a2c35;
      border-radius: 24px;
      padding: 30px 36px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: boing .8s cubic-bezier(.2, 1.6, .4, 1) both;
      border: 4px solid #c2415d
    }

    @keyframes boing {
      from {
        transform: scale(0) rotate(-25deg)
      }

      to {
        transform: none
      }
    }

    .wc .em {
      font-size: 64px;
      animation: dz .5s 3
    }

    .wc .nm {
      font-size: clamp(44px, 10vw, 64px);
      color: #c2415d;
      line-height: 1.1;
      margin: 6px 0 16px;
      word-break: break-word
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      background: var(--rose);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      z-index: 200;
      display: none
    }
  </style>
</head>

<body>
  <main>
    <div class="top"><a class="b alt sm" href="index.html">← Zum Brief</a><button class="b alt sm" id="mute"
        title="Ton">🔊</button></div>
    <header>
      <h1 class="script">Glücksrad & Team-Picker</h1>
      <p class="sub">Wer ist heute dran? Das Herz entscheidet ♥</p>
    </header>
    <div class="tabs"><button class="b on" id="tW">🎡 Glücksrad</button><button class="b" id="tT">🎩
        Team-Generator</button></div>

    <div class="grid">
      <section class="card stage">
        <div id="vW">
          <div class="wrap" id="wrap">
            <div class="ptr" id="ptr">♥</div><canvas id="cv"></canvas>
            <div class="hub" id="hub">😊</div>
          </div>
          <p class="hint">Tippen Sie auf das Gesicht in der Mitte, um zu drehen!</p>
          <button class="b" id="spin">Drehen ♥</button>
          <div class="hist" id="hist"></div>
        </div>
        <div id="vT" style="display:none">
          <div id="hat">🎩</div>
          <p class="hint" id="tHint">Wählen Sie rechts die Einstellungen und zaubern Sie die Teams!</p>
          <div class="tgrid" id="tgrid"></div>
          <div class="row" id="tAct" style="display:none;justify-content:center"><button class="b alt sm"
              id="again">Nochmal mischen</button><button class="b alt sm" id="copy">Kopieren</button></div>
        </div>
      </section>

      <aside class="card">
        <h3 class="script" style="font-size:36px">Eingabe</h3>
        <textarea id="names" spellcheck="false" aria-label="Namen, einer pro Zeile"></textarea>
        <div class="row"><span class="cnt" id="cnt">0 Namen</span><button class="b alt sm"
            id="shuf">Mischen</button><button class="b alt sm" id="clr">Leeren</button></div>
        <div id="oW"><label class="ck"><input type="checkbox" id="rm" checked> Gewinner:in nach dem Drehen
            entfernen</label></div>
        <div id="oT" style="display:none">
          <div class="row"><select id="mode">
              <option value="teams">Anzahl der Teams</option>
              <option value="size">Personen pro Team</option>
            </select><input type="number" id="num" min="1" max="50" value="2"></div>
          <button class="b" id="mk" style="width:100%">Teams zaubern ✨</button>
        </div>
      </aside>
    </div>
  </main>

  <div id="win">
    <div class="wc">
      <div class="em" id="wem">🥳</div>
      <div>Gewinner:in ist</div>
      <div class="nm script" id="wnm"></div><button class="b" id="ok">Super! ♥</button>
    </div>
  </div>
  <div id="toast"></div>


  <script>
    const $ = s => document.querySelector(s);

    const sv = (k, v) => {
      try { localStorage.setItem(k, v); } catch (e) { }
    };

    const ld = k => {
      try { return localStorage.getItem(k); } catch (e) { return null; }
    };

    const pal = [
      ['#f8b4c4', '#5a1a2c'],
      ['#fbd5c4', '#5a1a2c'],
      ['#e8627e', '#fff'],
      ['#fff1d6', '#5a1a2c'],
      ['#d9778f', '#fff'],
      ['#f6c1a8', '#5a1a2c'],
      ['#c2415d', '#fff'],
      ['#fde2e8', '#5a1a2c']
    ];

    // Nama tim otomatis berurutan
    const TN = Array.from(
      { length: 20 },
      (_, i) => `Team ${i + 1}`
    );

    const ta = $('#names');
    const cv = $('#cv');
    const ctx = cv.getContext('2d');

    ta.value = ld('wnames') ||
      'Anna\nBen\nClara\nDavid\nEmma\nFelix\nGreta\nHannah';

    let names = [];
    let ang = 0;
    let busy = false;
    let mute = false;
    let AC;

    // Fungsi shuffle tetap tersedia untuk fitur pengacakan manual
    const shuffle = a => {
      a = [...a];

      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }

      return a;
    };

    function toast(t) {
      const e = $('#toast');
      e.textContent = t;
      e.style.display = 'block';

      clearTimeout(e._t);

      e._t = setTimeout(() => {
        e.style.display = 'none';
      }, 2200);
    }

    function beep(f, d = .05, v = .06, ty = 'square') {
      if (mute) return;

      try {
        AC = AC || new (
          window.AudioContext || window.webkitAudioContext
        )();

        const o = AC.createOscillator();
        const g = AC.createGain();

        o.type = ty;
        o.frequency.value = f;
        g.gain.value = v;

        g.gain.exponentialRampToValueAtTime(
          .0001,
          AC.currentTime + d
        );

        o.connect(g).connect(AC.destination);
        o.start();
        o.stop(AC.currentTime + d);

      } catch (e) { }
    }

    function burst(x, y, n = 16) {
      for (let i = 0; i < n; i++) {
        const s = document.createElement('span');

        s.className = 'bu';
        s.textContent = ['♥', '♥', '✦', '🎀'][i % 4];

        s.style.cssText = `
        left:${x}px;
        top:${y}px;
        font-size:${14 + Math.random() * 24}px;
        --x:${(Math.random() - .5) * 360}px;
        --y:${-60 - Math.random() * 280}px;
        --r:${(Math.random() - .5) * 200}deg
      `;

        document.body.append(s);

        setTimeout(() => s.remove(), 1500);
      }
    }

    function float() {
      const s = document.createElement('span');

      s.className = 'fl';
      s.textContent = '♥';

      s.style.cssText = `
      left:${Math.random() * 100}vw;
      font-size:${12 + Math.random() * 26}px;
      animation-duration:${6 + Math.random() * 6}s
    `;

      document.body.append(s);

      setTimeout(() => s.remove(), 12500);
    }

    setInterval(float, 900);

    // Membaca daftar nama
    function parse() {
      names = ta.value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);

      $('#cnt').textContent =
        names.length + (names.length === 1 ? ' Name' : ' Namen');

      sv('wnames', ta.value);

      draw();
    }

    // Ukuran canvas
    function size() {
      const w = cv.parentElement.clientWidth;
      const d = devicePixelRatio || 1;

      cv.width = cv.height = w * d;
      cv.style.width = cv.style.height = w + 'px';

      ctx.setTransform(d, 0, 0, d, 0, 0);

      return w;
    }

    // Menggambar roda
    function draw() {
      if (cv.parentElement.clientWidth < 20) return;

      const W = size();
      const R = W / 2;
      const n = names.length;

      ctx.clearRect(0, 0, W, W);

      ctx.beginPath();
      ctx.arc(R, R, R - 2, 0, 7);
      ctx.fillStyle = '#c2415d';
      ctx.fill();

      const r = R - 18;

      if (!n) {
        ctx.beginPath();
        ctx.arc(R, R, r, 0, 7);
        ctx.fillStyle = '#fde2e8';
        ctx.fill();

        ctx.fillStyle = '#7a1f36';
        ctx.font = '700 22px Cormorant Garamond,serif';
        ctx.textAlign = 'center';

        ctx.fillText('Namen hinzufügen ♥', R, R + 80);
        return;
      }

      const s = 2 * Math.PI / n;

      for (let i = 0; i < n; i++) {
        ctx.beginPath();
        ctx.moveTo(R, R);

        ctx.arc(
          R, R, r,
          ang + i * s,
          ang + (i + 1) * s
        );

        ctx.closePath();

        ctx.fillStyle = pal[i % 8][0];
        ctx.fill();

        ctx.strokeStyle = '#fffaf0';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();

        ctx.translate(R, R);
        ctx.rotate(ang + (i + .5) * s);

        ctx.textAlign = 'right';
        ctx.fillStyle = pal[i % 8][1];

        const fs = Math.max(12, Math.min(26, s * r * .5));

        ctx.font = `700 ${fs}px Cormorant Garamond,Georgia,serif`;

        let t = names[i];

        if (t.length > 14) {
          t = t.slice(0, 13) + '…';
        }

        ctx.fillText(t, r - 14, fs * .3);

        ctx.restore();
      }

      for (let i = 0; i < 24; i++) {
        const a = i * Math.PI / 12;

        ctx.beginPath();

        ctx.arc(
          R + Math.cos(a) * (R - 9),
          R + Math.sin(a) * (R - 9),
          4,
          0,
          7
        );

        ctx.fillStyle = i % 2 ? '#fff1d6' : '#f8b4c4';
        ctx.fill();
      }
    }

    // Menentukan nama pada posisi penunjuk roda
    const cur = () => {
      if (!names.length) return 0;

      const s = 2 * Math.PI / names.length;

      const p = (
        (-Math.PI / 2 - ang) % (2 * Math.PI) +
        2 * Math.PI
      ) % (2 * Math.PI);

      return Math.floor(p / s);
    };

    const hub = (e, dz) => {
      $('#hub').textContent = e;
      $('#hub').classList.toggle('dz', !!dz);
    };

    function tick() {
      beep(900 + Math.random() * 200, .03);

      $('#ptr').animate(
        [
          { transform: 'translateX(-50%) rotate(-24deg)' },
          { transform: 'translateX(-50%) rotate(0)' }
        ],
        { duration: 130 }
      );
    }

    // Memutar roda
    function spin() {
      if (busy) return;

      parse();

      if (names.length < 2) {
        toast('Bitte mindestens 2 Namen eingeben');
        return;
      }

      busy = true;

      hub('🥴', true);

      const w = $('#wrap');

      w.classList.remove('pressed');
      void w.offsetWidth;
      w.classList.add('pressed');

      const st = ang;

      const tot =
        Math.PI * 2 * (6 + Math.random() * 3) +
        Math.random() * Math.PI * 2;

      const D = 5600;
      const t0 = performance.now();

      let last = cur();

      (function f(t) {
        const k = Math.min(1, (t - t0) / D);
        const e = 1 - Math.pow(1 - k, 4);

        ang = st + tot * e;

        draw();

        const i = cur();

        if (i !== last) {
          tick();
          last = i;
        }

        if (k > .8 && k < 1) {
          hub('😵‍💫', true);
        }

        if (k < 1) {
          requestAnimationFrame(f);
        } else {
          win(i);
        }

      })(t0);
    }

    // Hasil roda
    function win(i) {
      busy = false;

      hub('🥳');

      setTimeout(() => hub('😊'), 2500);

      const nm = names[i];

      $('#wnm').textContent = nm;

      $('#wem').textContent =
        ['🥳', '🎉', '😍', '🤩'][
        Math.floor(Math.random() * 4)
        ];

      $('#win').style.display = 'flex';

      [660, 830, 990, 1320].forEach((f, k) => {
        setTimeout(
          () => beep(f, .25, .08, 'triangle'),
          k * 110
        );
      });

      burst(innerWidth / 2, innerHeight / 2, 30);

      const c = document.createElement('span');

      c.className = 'chip';
      c.textContent = nm;

      $('#hist').prepend(c);

      $('#win')._n = nm;
    }

    // Tombol konfirmasi hasil roda
    $('#ok').onclick = () => {
      $('#win').style.display = 'none';

      if ($('#rm').checked) {
        const nm = $('#win')._n;
        const a = ta.value.split('\n');

        const k = a.findIndex(x => x.trim() === nm);

        if (k > -1) {
          a.splice(k, 1);
        }

        ta.value = a.join('\n');

        parse();
      }
    };

    $('#spin').onclick = $('#hub').onclick = spin;

    // Pergantian tab
    function tab(w) {
      $('#vW').style.display = w ? '' : 'none';
      $('#oW').style.display = w ? '' : 'none';

      $('#vT').style.display = w ? 'none' : '';
      $('#oT').style.display = w ? 'none' : '';

      $('#tW').classList.toggle('on', w);
      $('#tT').classList.toggle('on', !w);

      if (w) draw();
    }

    $('#tW').onclick = () => tab(true);
    $('#tT').onclick = () => tab(false);

    // =====================================
    // PEMBAGIAN TIM BERURUTAN
    // =====================================

    let result = [];

    function make() {
      parse();

      const n = names.length;

      if (n < 2) {
        toast('Bitte mindestens 2 Namen eingeben');
        return;
      }

      const v = Math.max(1, +$('#num').value || 2);

      let k = $('#mode').value === 'teams'
        ? Math.min(v, n)
        : Math.ceil(n / Math.min(v, n));

      // Membuat kelompok kosong
      const b = Array.from(
        { length: k },
        () => []
      );

      // Membagikan nama sesuai urutan input
      // Tidak menggunakan shuffle
      names.forEach((x, i) => {
        b[i % k].push(x);
      });

      const g = $('#tgrid');

      g.innerHTML = '';

      $('#tAct').style.display = 'none';
      $('#hat').style.display = 'block';

      $('#tHint').textContent = 'Die Teams werden vorbereitet …';

      [0, 1, 2, 3, 4, 5].forEach(i => {
        setTimeout(
          () => beep(300 + i * 90, .12, .05, 'sawtooth'),
          i * 200
        );
      });

      setTimeout(() => {
        $('#hat').style.display = 'none';

        $('#tHint').textContent = 'Ta-da! Ihre Teams ♥';

        // Nama tim selalu Team 1, Team 2, Team 3, dst.
        result = b.map((m, i) => ({
          n: `Team ${i + 1}`,
          m
        }));

        result.forEach((t, i) => {
          const d = document.createElement('div');

          d.className = 'team';

          d.style.cssText = `
          animation-delay:${i * .2}s;
          --r:${(Math.random() - .5) * 50}deg;
          --t:${i % 2 ? 1 : -1}deg
        `;

          d.innerHTML = `
          <h4 class="script"
              style="background:${[
              '#c2415d',
              '#d9778f',
              '#e8627e',
              '#a82a46'
            ][i % 4]};font-size:26px">

            <span>${t.n}</span>
            <span>${t.m.length}</span>

          </h4>

          <ul>
            ${t.m.map((x, j) => `
              <li style="animation-delay:${i * .2 + .5 + j * .15}s">
                ${x.replace(/</g, '&lt;')}
              </li>
            `).join('')}
          </ul>
        `;

          g.append(d);

          setTimeout(
            () => beep(500 + i * 60, .1, .06, 'triangle'),
            i * 200
          );
        });

        $('#tAct').style.display = 'flex';

        burst(innerWidth / 2, innerHeight * .5, 26);

      }, 1500);
    }

    $('#mk').onclick = $('#again').onclick = make;

    // Menyalin hasil pembagian tim
    $('#copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(
          result.map(t =>
            t.n + ': ' + t.m.join(', ')
          ).join('\n')
        );

        toast('Kopiert ♥');

      } catch (e) {
        toast('Kopieren nicht möglich');
      }
    };

    // Tombol acak manual daftar nama
    $('#shuf').onclick = () => {
      ta.value = shuffle(
        ta.value.split('\n').filter(x => x.trim())
      ).join('\n');

      parse();
    };

    // Menghapus daftar nama
    $('#clr').onclick = () => {
      ta.value = '';
      parse();
    };

    // Mengaktifkan / mematikan suara
    $('#mute').onclick = () => {
      mute = !mute;

      $('#mute').textContent = mute ? '🔇' : '🔊';
    };

    // Event listener
    ta.addEventListener('input', parse);

    addEventListener('resize', draw);

    document.fonts && document.fonts.ready.then(draw);

    // Inisialisasi
    parse();

  </script>

</body>

</html>
